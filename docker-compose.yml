services:
  pocketboard:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - pocketboard_data:/data
    environment:
      # Identity provider (Pocket ID)
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:?IDENTITY_BASE_URL is required}
      IDENTITY_API_KEY: ${IDENTITY_API_KEY:?IDENTITY_API_KEY is required}
      IDENTITY_CLIENT_ID: ${IDENTITY_CLIENT_ID:?IDENTITY_CLIENT_ID is required}
      IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:?IDENTITY_CLIENT_SECRET is required}
      # Mailbox provider (Migadu)
      MAILBOX_API_USER: ${MAILBOX_API_USER:?MAILBOX_API_USER is required}
      MAILBOX_API_KEY: ${MAILBOX_API_KEY:?MAILBOX_API_KEY is required}
      MAILBOX_DOMAIN: ${MAILBOX_DOMAIN:?MAILBOX_DOMAIN is required}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-smtp.migadu.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Organisation Onboarding}
      # Application
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      # Onboarding rate limiting
      RATE_LIMIT_PER_USER_PER_DAY: ${RATE_LIMIT_PER_USER_PER_DAY:-10}
      RATE_LIMIT_GLOBAL_PER_DAY: ${RATE_LIMIT_GLOBAL_PER_DAY:-100}
      # Offboarding rate limiting
      OFFBOARDING_RATE_LIMIT_PER_USER_PER_DAY: ${OFFBOARDING_RATE_LIMIT_PER_USER_PER_DAY:-5}
      OFFBOARDING_RATE_LIMIT_GLOBAL_PER_DAY: ${OFFBOARDING_RATE_LIMIT_GLOBAL_PER_DAY:-20}
      # Invite settings
      INVITE_TTL: ${INVITE_TTL:-168h}
      INVITE_USAGE_LIMIT: ${INVITE_USAGE_LIMIT:-1}
      # Group permission mappings
      GROUP_MAPPINGS: ${GROUP_MAPPINGS:?GROUP_MAPPINGS is required}
      DEFAULT_SELECTED_GROUPS: ${DEFAULT_SELECTED_GROUPS:-}
      # Offboarding
      OFFBOARDING_MAPPINGS: ${OFFBOARDING_MAPPINGS:-}
      LINKED_ACCOUNTS_IT_EMAIL: ${LINKED_ACCOUNTS_IT_EMAIL:-}
      # Mattermost linked-account discovery (optional)
      MATTERMOST_URL: ${MATTERMOST_URL:-}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN:-}
      # Access control (all default-deny)
      AUDIT_LOG_GROUPS: ${AUDIT_LOG_GROUPS:-}
      AUDIT_LOG_CLEAR_GROUPS: ${AUDIT_LOG_CLEAR_GROUPS:-}
      EMAIL_TEMPLATE_GROUPS: ${EMAIL_TEMPLATE_GROUPS:-}
      ORG_OVERVIEW_GROUPS: ${ORG_OVERVIEW_GROUPS:-}
      # Badge mappings for organisation overview
      BADGE_MAPPINGS: ${BADGE_MAPPINGS:-}
      # Webhook notifications (optional)
      WEBHOOK_URL: ${WEBHOOK_URL:-}

volumes:
  pocketboard_data:
